# ============================================================
# Build & Push Docker Image to GitHub Container Registry
# Trigger: Push to main branch
# Registry: ghcr.io
# ============================================================

name: Build & Push Docker Image

on:
  push:
    branches: [main]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/uselflabs-landing-page

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest

    # Required permissions for ghcr.io
    permissions:
      contents: read
      packages: write

    steps:
      # ------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # 2. Set up Docker Buildx for advanced features
      # ------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------
      # 3. Login to GitHub Container Registry
      # ------------------------------------------
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------
      # 4. Extract metadata (tags, labels)
      # ------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag "latest" on default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with short SHA for traceability
            type=sha,prefix=,format=short
            # Tag with branch name
            type=ref,event=branch

      # ------------------------------------------
      # 5. Build and push Docker image
      # ------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer caching via GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build provenance for supply chain security
          provenance: false
