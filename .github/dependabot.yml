# ============================================================
# Dependabot — automated dependency updates
# Security patches arrive immediately regardless of schedule;
# the intervals below govern routine version bumps.
# ============================================================

version: 2

updates:
  # ----------------------------------------
  # npm dependencies
  # ----------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Next.js and React move together — separate PRs would
      # produce unbuildable intermediate states
      react-next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Routine dev tooling, batched to reduce PR noise
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"

  # ----------------------------------------
  # GitHub Actions used by our workflows
  # ----------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # ----------------------------------------
  # Docker base image (node:24-alpine)
  # ----------------------------------------
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # The tag floats within a major, so 24.x patches — including CVE
      # fixes — land on rebuild without a PR. Major bumps are declined
      # because Dependabot offers the newest line regardless of LTS
      # status; revisit deliberately when the active LTS advances.
      - dependency-name: node
        update-types:
          - version-update:semver-major
